<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 156" width="120" height="156">
  <!-- "Percy", el robot técnico de PercyTech: casco de seguridad, visor y la boleta rendida. -->
  <ellipse cx="60" cy="150" rx="34" ry="5" fill="#0D1B3E" opacity="0.12"/>
  <!-- antena -->
  <line x1="60" y1="8" x2="60" y2="20" stroke="#0D1B3E" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="7" r="5" fill="#2A7FFF"/>
  <!-- cuerpo -->
  <rect x="30" y="92" width="60" height="46" rx="14" fill="#0D1B3E"/>
  <rect x="44" y="102" width="32" height="18" rx="5" fill="#16264f"/>
  <text x="60" y="115.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#2A7FFF">PT</text>
  <!-- piernas -->
  <rect x="40" y="136" width="13" height="12" rx="4" fill="#16264f"/>
  <rect x="67" y="136" width="13" height="12" rx="4" fill="#16264f"/>
  <!-- brazo izquierdo saludando -->
  <path d="M32 104 C20 98 14 86 16 74" stroke="#0D1B3E" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="16" cy="71" r="7" fill="#2A7FFF"/>
  <!-- brazo derecho con la boleta -->
  <path d="M88 106 C98 108 102 114 102 120" stroke="#0D1B3E" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g transform="rotate(8 104 112)">
    <path d="M92 96h24v34l-4-2.5-4 2.5-4-2.5-4 2.5-4-2.5-4 2.5z" fill="#ffffff" stroke="#d6dbe6" stroke-width="1.2"/>
    <line x1="96" y1="102" x2="112" y2="102" stroke="#c4cad6" stroke-width="2"/>
    <line x1="96" y1="107" x2="108" y2="107" stroke="#c4cad6" stroke-width="2"/>
    <path d="M97.5 115l4 4 8-8.5" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="102" cy="121" r="6" fill="#2A7FFF"/>
  <!-- cabeza -->
  <rect x="22" y="34" width="76" height="58" rx="22" fill="#2A7FFF"/>
  <rect x="31" y="47" width="58" height="34" rx="14" fill="#0D1B3E"/>
  <!-- ojos y sonrisa en el visor -->
  <ellipse cx="47" cy="61" rx="5.5" ry="6.5" fill="#7fd3ff"/>
  <ellipse cx="73" cy="61" rx="5.5" ry="6.5" fill="#7fd3ff"/>
  <circle cx="49" cy="58.5" r="1.8" fill="#ffffff"/>
  <circle cx="75" cy="58.5" r="1.8" fill="#ffffff"/>
  <path d="M51 71 Q60 77 69 71" stroke="#7fd3ff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- orejas -->
  <rect x="15" y="54" width="9" height="18" rx="4" fill="#0D1B3E"/>
  <rect x="96" y="54" width="9" height="18" rx="4" fill="#0D1B3E"/>
  <!-- casco de seguridad -->
  <path d="M24 40 C24 20 40 14 60 14 C80 14 96 20 96 40 Z" fill="#F5B700"/>
  <rect x="17" y="37" width="86" height="8" rx="4" fill="#E0A100"/>
  <rect x="55" y="15" width="10" height="23" rx="4" fill="#FFCB2E"/>
</svg>
